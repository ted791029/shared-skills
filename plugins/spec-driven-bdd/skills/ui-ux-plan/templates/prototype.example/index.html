<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>相簿</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f4f0;
    --surface: #ffffff;
    --surface-2: #ece8e2;
    --text: #1d1b18;
    --muted: #77716a;
    --line: #e2dcd3;
    --ink: #1d1b18;
    --ink-text: #ffffff;
    --accent: #3157d5;
    --accent-soft: #e6ebfb;
    --danger: #c9252d;
    --success: #1a7f4b;
    --success-soft: #e0f3e8;
    --chip: rgba(255,255,255,.86);
    --chip-text: #3a3632;
    --glass: rgba(246,244,240,.8);
    --brand: linear-gradient(135deg, #ffb35c 0%, #ff6b8b 50%, #7a6bff 100%);
    --radius: 18px;
    --shadow: 0 1px 2px rgba(45,30,15,.06), 0 8px 24px rgba(45,30,15,.08);
    --shadow-hover: 0 2px 4px rgba(45,30,15,.06), 0 18px 36px rgba(45,30,15,.14);
    --shadow-lift: 0 26px 50px rgba(45,30,15,.24), 0 6px 14px rgba(45,30,15,.10);
    --ease: cubic-bezier(.2,.8,.2,1);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141312;
      --surface: #1f1d1b;
      --surface-2: #2b2825;
      --text: #f3efe9;
      --muted: #a29b92;
      --line: #36322e;
      --ink: #f3efe9;
      --ink-text: #141312;
      --accent: #8aa4ff;
      --accent-soft: rgba(138,164,255,.14);
      --danger: #ff6b6b;
      --success: #4cc38a;
      --success-soft: rgba(76,195,138,.15);
      --chip: rgba(31,29,27,.82);
      --chip-text: #e8e3dc;
      --glass: rgba(20,19,18,.78);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --shadow-hover: 0 2px 4px rgba(0,0,0,.3), 0 18px 36px rgba(0,0,0,.45);
      --shadow-lift: 0 26px 50px rgba(0,0,0,.55), 0 6px 14px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); }
  body.dragging { cursor: grabbing; user-select: none; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .top { position: sticky; top: 0; z-index: 10; background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); }
  .top-inner { max-width: 1200px; margin: 0 auto; padding: 32px 40px 22px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
  h1 { margin: 0; font-size: 40px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
  .summary { margin: 8px 0 0; color: var(--muted); font-size: 15px; min-height: 22px; font-variant-numeric: tabular-nums; }
  .actions { display: flex; align-items: center; gap: 10px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s, transform .1s, box-shadow .2s; }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--ink-text); box-shadow: 0 6px 16px rgba(29,27,24,.18); }
  .btn.primary:hover { background: color-mix(in srgb, var(--ink) 84%, var(--bg)); }
  .btn svg { width: 16px; height: 16px; }

  .pill { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px 0 12px; border-radius: 999px; border: 0; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; }
  .pill .ring { width: 16px; height: 16px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  .pill.done .ring { animation: none; border-color: var(--accent); background: var(--accent); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px 40px 80px; }
  .album-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 44px 32px; }

  .album { position: relative; -webkit-user-select: none; user-select: none; }
  .album-link { display: block; text-decoration: none; color: inherit; border-radius: var(--radius); -webkit-touch-callout: none; }
  .stack { position: relative; aspect-ratio: 4 / 3; }
  .stack::before, .stack::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius); box-shadow: var(--shadow); transition: transform .4s var(--ease); }
  .stack::before { background: var(--surface-2); transform: rotate(-5deg) translate(-3px, -4px) scale(.97); }
  .stack::after { background: var(--surface); transform: rotate(3.5deg) translate(4px, -2px) scale(.98); }
  .album.single .stack::before, .album.single .stack::after { display: none; }
  .album-link:hover .stack::before { transform: rotate(-8deg) translate(-12px, -4px) scale(.97); }
  .album-link:hover .stack::after { transform: rotate(6deg) translate(12px, -2px) scale(.98); }
  .cover { position: absolute; inset: 0; z-index: 1; border-radius: var(--radius); overflow: hidden; background: var(--surface-2); box-shadow: var(--shadow); transition: transform .35s var(--ease), box-shadow .35s var(--ease); }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; -webkit-user-drag: none; transition: transform .6s var(--ease); }
  .album-link:hover .cover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
  .album-link:hover .cover img { transform: scale(1.04); }
  .meta { padding: 16px 4px 0; }
  .name { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.35; letter-spacing: -.01em; }
  .count { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .handle { position: absolute; top: 12px; right: 12px; z-index: 2; width: 36px; height: 36px; border-radius: 12px; border: 0; display: grid; place-items: center; background: var(--chip); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--chip-text); cursor: grab; opacity: 0; transform: translateY(-4px); transition: opacity .2s, transform .2s var(--ease); touch-action: none; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .handle svg { width: 16px; height: 16px; }
  .album:hover .handle, .handle:focus-visible, .album.lifted .handle { opacity: 1; transform: none; }
  @media (hover: none) { .handle { opacity: 1; transform: none; } }

  .album.placeholder .album-link { visibility: hidden; }
  .album.placeholder::before { content: ""; position: absolute; inset: 0 0 auto 0; aspect-ratio: 4 / 3; border-radius: var(--radius); border: 2px dashed color-mix(in srgb, var(--accent) 55%, transparent); background: var(--accent-soft); }
  .album.lifted .cover { transform: scale(1.03); box-shadow: 0 0 0 3px var(--accent), var(--shadow-lift); }
  .ghost { position: fixed; top: 0; left: 0; z-index: 50; pointer-events: none; margin: 0; list-style: none; transition: opacity .15s; }
  .ghost .cover { box-shadow: var(--shadow-lift); transform: rotate(-2deg) scale(1.05); }
  .ghost .stack::before, .ghost .stack::after, .ghost .handle, .ghost .meta { opacity: 0; }
  .ghost.invalid { opacity: .5; }
  .album.enter { animation: enter .5s var(--ease); }
  @keyframes enter { from { opacity: 0; transform: translateY(10px) scale(.94); } }

  .skeleton .stack::before, .skeleton .stack::after { display: none; }
  .skeleton .cover { box-shadow: none; }
  .shimmer { background: linear-gradient(90deg, var(--surface-2) 0%, color-mix(in srgb, var(--surface-2) 40%, var(--surface)) 45%, var(--surface-2) 90%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  .line { height: 15px; border-radius: 6px; margin: 18px 4px 0; width: 68%; }
  .line.short { width: 34%; height: 12px; margin-top: 9px; }

  .empty { max-width: 440px; margin: 72px auto 0; padding: 48px 32px 44px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); }
  .empty > svg { width: 200px; height: 150px; }
  .empty .card-back { fill: var(--accent-soft); }
  .empty .card-mid { fill: var(--surface-2); }
  .empty .card-front { fill: var(--surface); stroke: var(--line); }
  .empty h2 { margin: 24px 0 8px; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .empty p { margin: 0 0 28px; color: var(--muted); font-size: 15px; line-height: 1.7; }

  dialog.sheet { width: min(480px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 26px; padding: 0; background: var(--surface); color: var(--text); box-shadow: 0 40px 100px rgba(20,12,4,.3); }
  dialog.sheet::backdrop { background: rgba(20,16,12,.38); backdrop-filter: blur(4px); }
  dialog.sheet[open] { animation: pop .28s var(--ease); }
  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.97); } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 0 28px; }
  .sheet-head h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  .icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--surface-2); display: grid; place-items: center; cursor: pointer; color: var(--muted); transition: background .15s; }
  .icon-btn:hover { background: var(--line); }
  .icon-btn svg { width: 14px; height: 14px; }
  .sheet section { padding: 22px 28px 28px; }
  .drop { border: 1.5px dashed var(--line); border-radius: 20px; padding: 36px 24px 32px; text-align: center; background: var(--bg); }
  .drop-icon { width: 68px; height: 68px; margin: 0 auto; border-radius: 20px; display: grid; place-items: center; background: var(--brand); color: #fff; box-shadow: 0 10px 24px rgba(255,107,139,.35); transform: rotate(-4deg); }
  .drop-icon svg { width: 36px; height: 36px; }
  .drop-title { margin: 18px 0 6px; font-size: 17px; font-weight: 700; }
  .hint { margin: 0 0 20px; color: var(--muted); font-size: 13.5px; line-height: 1.65; }
  .progress-label { margin: 4px 0 14px; font-size: 28px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-bottom: 16px; }
  .bar span { display: block; height: 100%; width: 0; background: var(--brand); border-radius: 99px; transition: width .25s var(--ease); }
  .sheet-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
  .done-icon { width: 60px; height: 60px; border-radius: 50%; background: var(--success-soft); color: var(--success); display: grid; place-items: center; margin: 2px auto 14px; animation: pop .4s var(--ease); }
  .done-icon svg { width: 28px; height: 28px; }
  .done-title { margin: 0 0 18px; text-align: center; font-size: 21px; font-weight: 800; letter-spacing: -.01em; }
  .done-list { list-style: none; margin: 0 0 14px; padding: 4px 16px; border-radius: 16px; background: var(--bg); }
  .done-list:empty { display: none; }
  .done-list li { padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .done-list li:last-child { border-bottom: 0; }
  .done-list .group { font-weight: 700; padding-bottom: 4px; border-bottom: 0; }
  .done-list .file { padding: 4px 0 4px 14px; border-bottom: 0; color: var(--muted); font-size: 13px; }
  .done-list .file + li:not(.file) { border-top: 1px solid var(--line); }
  .done-list .fail { color: var(--danger); }

  .toast { position: fixed; left: 50%; bottom: 32px; z-index: 60; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; max-width: calc(100vw - 32px); padding: 13px 20px; border-radius: 16px; background: var(--ink); color: var(--ink-text); font-size: 14px; font-weight: 500; line-height: 1.5; box-shadow: 0 14px 36px rgba(0,0,0,.25); transition: opacity .2s, transform .3s var(--ease); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 600px) {
    .top-inner { padding: 22px 16px 14px; }
    h1 { font-size: 30px; }
    .summary { font-size: 13.5px; }
    .wrap { padding: 8px 16px 56px; }
    .album-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 16px; }
    .btn.primary .label-long { display: none; }
    .btn { padding: 0 16px; }
    .name { font-size: 14px; }
    .count { font-size: 12.5px; }
    .meta { padding-top: 12px; }
    .empty { margin-top: 32px; padding: 36px 20px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div>
      <h1>相簿</h1>
      <p class="summary" id="summary"></p>
    </div>
    <div class="actions">
      <button class="pill" id="import-pill" hidden><span class="ring"></span><span id="import-pill-text"></span></button>
      <button class="btn primary" id="open-import" data-testid="open-import">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
        <span>匯入<span class="label-long">照片</span></span>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <ul class="album-grid" id="grid" data-testid="home-album-list" aria-label="相簿列表"></ul>
  <section class="empty" id="empty" hidden>
    <svg viewBox="0 0 200 150" aria-hidden="true">
      <defs>
        <linearGradient id="empty-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf9e"/><stop offset="1" stop-color="#ffe9d6"/></linearGradient>
      </defs>
      <rect class="card-back" x="30" y="26" width="100" height="80" rx="12" transform="rotate(-12 80 66)"/>
      <rect class="card-mid" x="70" y="22" width="100" height="80" rx="12" transform="rotate(10 120 62)"/>
      <g transform="rotate(-2 100 78)">
        <rect class="card-front" x="46" y="36" width="108" height="86" rx="12" stroke-width="1.5"/>
        <rect x="54" y="44" width="92" height="62" rx="7" fill="url(#empty-sky)"/>
        <circle cx="124" cy="62" r="8" fill="#fff4dc"/>
        <path d="M54 94l22-20 16 12 14-10 40 22v1a7 7 0 0 1-7 7H61a7 7 0 0 1-7-7z" fill="#e79a7c"/>
        <path d="M54 100l30-14 22 10 16-6 24 10v1a7 7 0 0 1-7 6H61a7 7 0 0 1-7-6z" fill="#b8665c"/>
      </g>
    </svg>
    <h2>還沒有相簿</h2>
    <p>匯入照片後，系統會依拍攝日期自動分成相簿。</p>
    <button class="btn primary" id="empty-import">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
      匯入照片
    </button>
  </section>
</main>

<dialog class="sheet" id="import-dialog" data-testid="import-dialog" aria-labelledby="import-title">
  <div class="sheet-head">
    <h2 id="import-title">匯入照片</h2>
    <button class="icon-btn" data-close aria-label="關閉"><svg viewBox="0 0 14 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg></button>
  </div>
  <section data-view="pick">
    <div class="drop">
      <div class="drop-icon"><svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><rect x="4" y="7" width="28" height="22" rx="5"/><circle cx="12.5" cy="14.5" r="2.5"/><path d="M4 25l8-7 6 5 5-4 9 7"/></svg></div>
      <p class="drop-title">選擇要匯入的照片</p>
      <p class="hint">可選 JPEG、PNG、HEIC，一次可選多張。</p>
      <button class="btn primary" id="choose">選擇照片</button>
    </div>
  </section>
  <section data-view="progress" hidden>
    <p class="progress-label" id="progress-label"></p>
    <div class="bar" id="progress-bar" role="progressbar" aria-label="匯入進度" aria-valuemin="0"><span></span></div>
    <p class="hint">照片會依拍攝日期自動分進相簿。你可以先關閉視窗，匯入會在背景繼續。</p>
    <div class="sheet-foot"><button class="btn" data-close>在背景繼續</button></div>
  </section>
  <section data-view="done" hidden>
    <div class="done-icon"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13.5l4.5 4.5L20 8"/></svg></div>
    <p class="done-title" id="done-title"></p>
    <ul class="done-list" id="done-list"></ul>
    <div class="sheet-foot"><button class="btn primary" data-close>完成</button></div>
  </section>
</dialog>

<div class="toast" id="toast" role="status"></div>
<div class="sr-only" id="live" aria-live="assertive"></div>

<script>
/* ---------- 情境與假資料 ---------- */
const params = new URLSearchParams(location.search);
const SCENARIO = ['loading', 'empty', 'error'].includes(params.get('state')) ? params.get('state') : '';
const NS = 'album-proto:' + (SCENARIO || 'default') + ':';
function load(key, fallback) { try { const v = localStorage.getItem(NS + key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
function save(key, val) { try { localStorage.setItem(NS + key, JSON.stringify(val)); } catch (e) {} }
function withState(url) { return SCENARIO ? url + (url.includes('?') ? '&' : '?') + 'state=' + SCENARIO : url; }

const BASE_ALBUMS = SCENARIO === 'empty' ? [] : [
  ['2026-10-18', 24], ['2026-10-12', 8], ['2026-10-11', 36], ['2026-10-05', 3],
  ['2026-10-01', 50], ['2026-09-27', 12], ['2026-09-21', 1], ['2026-09-20', 18],
  ['2026-09-13', 6], ['2026-09-06', 27], ['2026-08-30', 9], ['2026-08-15', 64],
];
const store = { added: load('added', {}), deleted: new Set(load('deleted', [])), order: load('order', null) };
function persist() { save('added', store.added); save('deleted', [...store.deleted]); save('order', store.order); }

function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let s = seed || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; }; }

const WEEK = '日一二三四五六';
function albumName(id) { const [y, m, d] = id.split('-').map(Number); return `${y}年${m}月${d}日（星期${WEEK[new Date(y, m - 1, d).getDay()]}）`; }
function albumIds() { const ids = new Set(BASE_ALBUMS.map(a => a[0])); Object.keys(store.added).forEach(id => ids.add(id)); return [...ids]; }
function totalOf(id) { const b = BASE_ALBUMS.find(a => a[0] === id); return (b ? b[1] : 0) + (store.added[id] || 0); }
function photosOf(id) {
  const list = [];
  for (let i = 0, n = totalOf(id); i < n; i++) {
    const pid = id + '-' + i;
    if (store.deleted.has(pid)) continue;
    const r = rng(hash(pid));
    list.push({ id: pid, minutes: 7 * 60 + Math.floor(r() * 14 * 60), portrait: r() < .28, estimated: hash(pid + 'e') % 19 === 0 });
  }
  return list.sort((a, b) => a.minutes - b.minutes || (a.id < b.id ? -1 : 1));
}

/* ---------- 假照片：依拍攝時段產生風景 ---------- */
const PALETTES = {
  dawn:    { sky: ['#f3a99a', '#fde6d4'], sun: '#fff4e0', far: '#e3a596', near: '#5e3d48' },
  mist:    { sky: ['#b7c4cd', '#eef1f2'], sun: '#ffffff', far: '#a7b6bf', near: '#43555f' },
  morning: { sky: ['#78b1e3', '#eaf4fb'], sun: '#fffbe8', far: '#9cc3b2', near: '#27523f' },
  noon:    { sky: ['#3f97dc', '#cfe8f7'], sun: '#ffffff', far: '#7cae9d', near: '#1f4a3a' },
  golden:  { sky: ['#ea9050', '#fcdcae'], sun: '#fff1c8', far: '#cc8a68', near: '#462a24' },
  dusk:    { sky: ['#3a3577', '#f2937a'], sun: '#ffd59c', far: '#7a5a8c', near: '#1e1733' },
  night:   { sky: ['#08122b', '#2c4470'], sun: '#f2efe2', far: '#22345a', near: '#060d1b' },
};
function paletteFor(minutes, r) {
  const h = minutes / 60;
  if (h < 8.5) return r() < .5 ? 'dawn' : 'mist';
  if (h < 11) return r() < .75 ? 'morning' : 'mist';
  if (h < 15.5) return 'noon';
  if (h < 17.5) return 'golden';
  if (h < 19) return 'dusk';
  return 'night';
}
function mix(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  return '#' + [16, 8, 0].map(s => Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t).toString(16).padStart(2, '0')).join('');
}
const photoCache = new Map();
function photoSrc(p) {
  if (photoCache.has(p.id)) return photoCache.get(p.id);
  const r = rng(hash(p.id + 'scene'));
  const W = p.portrait ? 900 : 1200, H = p.portrait ? 1200 : 900, R = Math.round;
  const key = paletteFor(p.minutes, r), pal = PALETTES[key], night = key === 'night';
  const kind = ['mountain', 'sea', 'hills', 'city'][Math.floor(r() * 4)];
  const horizon = H * (.52 + r() * .14);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"><defs>`
    + `<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${pal.sky[0]}"/><stop offset="${(horizon / H).toFixed(2)}" stop-color="${pal.sky[1]}"/></linearGradient>`
    + `<radialGradient id="s"><stop offset="0" stop-color="${pal.sun}"/><stop offset=".3" stop-color="${pal.sun}" stop-opacity=".55"/><stop offset="1" stop-color="${pal.sun}" stop-opacity="0"/></radialGradient>`
    + `<linearGradient id="h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${pal.sky[1]}" stop-opacity="0"/><stop offset=".5" stop-color="${pal.sky[1]}" stop-opacity=".55"/><stop offset="1" stop-color="${pal.sky[1]}" stop-opacity="0"/></linearGradient>`
    + `<radialGradient id="v" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="${night ? .45 : .28}"/></radialGradient>`
    + `</defs><rect width="${W}" height="${H}" fill="url(#g)"/>`;
  if (night) for (let i = 0; i < 80; i++) s += `<circle cx="${R(r() * W)}" cy="${R(r() * H * .55)}" r="${(r() * 2 + .5).toFixed(1)}" fill="#fff" opacity="${(r() * .6 + .2).toFixed(2)}"/>`;
  const sx = W * (.15 + r() * .7), sy = horizon - H * (.1 + r() * .25), sr = Math.min(W, H) * (.04 + r() * .03);
  s += `<circle cx="${R(sx)}" cy="${R(sy)}" r="${R(sr * 6)}" fill="url(#s)" opacity=".8"/><circle cx="${R(sx)}" cy="${R(sy)}" r="${R(sr)}" fill="${pal.sun}"/>`;
  if (!night) for (let i = 0; i < 3; i++) {
    const cx = r() * W, cy = H * (.1 + r() * .28), cw = W * (.1 + r() * .16);
    s += `<ellipse cx="${R(cx)}" cy="${R(cy)}" rx="${R(cw)}" ry="${R(cw * .14)}" fill="#fff" opacity="${(.25 + r() * .25).toFixed(2)}"/><ellipse cx="${R(cx + cw * .25)}" cy="${R(cy - cw * .08)}" rx="${R(cw * .5)}" ry="${R(cw * .13)}" fill="#fff" opacity=".35"/>`;
  }
  const ridge = (base, amp, step) => {
    const pts = []; for (let x = -step; x <= W + step; x += step) pts.push([x, base - r() * amp]);
    let d = `M0 ${H} L0 ${R(pts[0][1])}`;
    for (let i = 0; i < pts.length - 1; i++) { const [x1, y1] = pts[i], [x2, y2] = pts[i + 1]; d += ` Q${R(x1)} ${R(y1)} ${R((x1 + x2) / 2)} ${R((y1 + y2) / 2)}`; }
    return d + ` L${W} ${H}Z`;
  };
  const haze = y => `<rect y="${R(y - H * .12)}" width="${W}" height="${R(H * .24)}" fill="url(#h)"/>`;
  if (kind === 'sea') {
    s += `<path d="${ridge(horizon, H * .05, W / 5)}" fill="${mix(pal.far, pal.sky[1], .45)}"/>` + haze(horizon);
    s += `<rect y="${R(horizon)}" width="${W}" height="${R(H - horizon)}" fill="${mix(pal.sky[0], pal.near, .4)}"/>`;
    for (let i = 0; i < 16; i++) { const y = horizon + 8 + i * (H - horizon) / 16, w = sr * (1.2 + i * .55); s += `<rect x="${R(sx - w / 2 + (r() - .5) * 26)}" y="${R(y)}" width="${R(w)}" height="3" rx="1.5" fill="${pal.sun}" opacity="${(.6 - i * .03).toFixed(2)}"/>`; }
    s += `<path d="M0 ${H} L0 ${R(H * .9)} Q${R(W * .3)} ${R(H * .85)} ${R(W * .6)} ${R(H * .92)} T${W} ${R(H * .89)} L${W} ${H}Z" fill="${mix(pal.near, '#e8d9b8', night ? .1 : .5)}"/>`;
  } else if (kind === 'city') {
    s += `<path d="${ridge(horizon, H * .08, W / 5)}" fill="${mix(pal.far, pal.sky[1], .4)}"/>` + haze(horizon);
    const base = horizon + H * .12;
    for (let x = -10; x < W;) {
      const bw = 50 + r() * 70, bh = H * (.08 + r() * .3), c = mix(pal.far, pal.near, .55 + r() * .35);
      s += `<rect x="${R(x)}" y="${R(base - bh)}" width="${R(bw)}" height="${R(bh + H)}" rx="2" fill="${c}"/>`;
      if (night || key === 'dusk') for (let wy = base - bh + 14; wy < base - 8; wy += 22) for (let wx = x + 10; wx < x + bw - 12; wx += 18) if (r() < .45) s += `<rect x="${R(wx)}" y="${R(wy)}" width="8" height="10" rx="1" fill="#ffd98a" opacity="${(.5 + r() * .5).toFixed(2)}"/>`;
      x += bw + 4;
    }
    s += `<rect y="${R(base)}" width="${W}" height="${R(H - base)}" fill="${pal.near}"/>`;
  } else {
    const tall = kind === 'mountain';
    for (let li = 0; li < 3; li++) {
      s += `<path d="${ridge(horizon + li * H * .1, H * (tall ? .3 - li * .07 : .1), tall ? W / 7 : W / 3.5)}" fill="${mix(mix(pal.far, pal.near, li / 2), pal.sky[1], (2 - li) * .16)}"/>`;
      if (li < 2) s += haze(horizon + li * H * .1 + H * .04);
    }
  }
  s += `<rect width="${W}" height="${H}" fill="url(#v)"/>`;
  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s + '</svg>');
  photoCache.set(p.id, url);
  return url;
}

/* ---------- 共用回饋 ---------- */
const live = document.getElementById('live');
function announce(msg) { live.textContent = ''; setTimeout(() => live.textContent = msg, 30); }
let toastTimer;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 4000); }

/* ---------- 相簿列表 ---------- */
const grid = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const summaryEl = document.getElementById('summary');
const openImportBtn = document.getElementById('open-import');
const cardEls = new Map();
let pendingRender = false;

function listAlbums() {
  const all = albumIds().map(id => { const photos = photosOf(id); return { id, name: albumName(id), count: photos.length, cover: photos[0] }; }).filter(a => a.count > 0);
  const byDate = (a, b) => a.id < b.id ? 1 : -1;
  if (!store.order) return all.sort(byDate);
  const pos = new Map(store.order.map((id, i) => [id, i]));
  return [...all.filter(a => !pos.has(a.id)).sort(byDate), ...all.filter(a => pos.has(a.id)).sort((a, b) => pos.get(a.id) - pos.get(b.id))];
}

const GRIP = '<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="5.5" cy="3.5" r="1.4"/><circle cx="10.5" cy="3.5" r="1.4"/><circle cx="5.5" cy="8" r="1.4"/><circle cx="10.5" cy="8" r="1.4"/><circle cx="5.5" cy="12.5" r="1.4"/><circle cx="10.5" cy="12.5" r="1.4"/></svg>';
function cardFor(a, isNew) {
  let li = cardEls.get(a.id);
  if (!li) {
    li = document.createElement('li');
    li.className = 'album' + (isNew ? ' enter' : '');
    li.addEventListener('animationend', () => li.classList.remove('enter'), { once: true });
    li.dataset.id = a.id;
    li.innerHTML = `<a class="album-link" draggable="false"><div class="stack"><div class="cover"><img draggable="false"></div></div><div class="meta"><h2 class="name"></h2><p class="count"></p></div></a><button class="handle" title="拖曳以調整順序">${GRIP}</button>`;
    cardEls.set(a.id, li);
  }
  const img = li.querySelector('img'), src = photoSrc(a.cover);
  if (img.getAttribute('src') !== src) img.src = src;
  img.alt = `${a.name}，${a.count} 張照片`;
  li.classList.toggle('single', a.count === 1);
  li.querySelector('.album-link').href = withState('album.html?id=' + a.id);
  li.querySelector('.name').textContent = a.name;
  li.querySelector('.count').textContent = `${a.count} 張照片`;
  li.querySelector('.handle').setAttribute('aria-label', `調整${a.name}的順序。按空白鍵拿起，方向鍵移動，再按空白鍵放下`);
  li.dataset.name = a.name;
  return li;
}

let firstRender = true;
function renderAlbums() {
  if ((drag && drag.started) || kb) { pendingRender = true; return; }
  pendingRender = false;
  const albums = listAlbums();
  const isEmpty = albums.length === 0;
  emptyEl.hidden = !isEmpty;
  grid.hidden = isEmpty;
  openImportBtn.hidden = isEmpty && !importJob;
  const total = albums.reduce((n, a) => n + a.count, 0);
  summaryEl.textContent = isEmpty ? '' : `${albums.length} 本相簿・${total.toLocaleString()} 張照片`;
  grid.querySelectorAll('.skeleton').forEach(el => el.remove());
  const keep = new Set(albums.map(a => a.id));
  cardEls.forEach((li, id) => { if (!keep.has(id)) { li.remove(); cardEls.delete(id); } });
  let ref = grid.firstChild;
  albums.forEach(a => {
    const li = cardFor(a, !firstRender && !cardEls.has(a.id));
    if (li !== ref) grid.insertBefore(li, ref); else ref = ref.nextSibling;
  });
  firstRender = false;
}

function renderSkeleton(n) {
  grid.innerHTML = Array.from({ length: n }, () => '<li class="album skeleton" aria-hidden="true"><div class="stack"><div class="cover shimmer"></div></div><div class="line shimmer"></div><div class="line short shimmer"></div></li>').join('');
  grid.setAttribute('aria-busy', 'true');
  summaryEl.textContent = '正在載入相簿…';
}

/* ---------- 拖放排序（滑鼠、觸控） ---------- */
let drag = null, suppressClick = false;
const domOrder = () => [...grid.querySelectorAll('.album')].map(el => el.dataset.id);
const indexOf = li => [...grid.children].indexOf(li);

function flip(mutate) {
  const items = [...grid.children];
  const first = new Map(items.map(el => [el, el.getBoundingClientRect()]));
  mutate();
  items.forEach(el => {
    const f = first.get(el), l = el.getBoundingClientRect(), dx = f.left - l.left, dy = f.top - l.top;
    if (dx || dy) el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 240, easing: 'cubic-bezier(.2,.8,.2,1)' });
  });
}
function placeAt(li, index) {
  const others = [...grid.children].filter(c => c !== li);
  const ref = others[index] || null;
  if (li.nextElementSibling === ref && indexOf(li) === index) return;
  flip(() => grid.insertBefore(li, ref));
}

grid.addEventListener('pointerdown', e => {
  const li = e.target.closest('.album:not(.skeleton)');
  if (!li || e.button !== 0 || kb) return;
  const onHandle = !!e.target.closest('.handle');
  if (e.pointerType === 'touch' && !onHandle) return;
  if (onHandle) e.preventDefault();
  drag = { li, pointerId: e.pointerId, x0: e.clientX, y0: e.clientY, started: false };
});
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pointerId) return;
  if (!drag.started) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
    startDrag(e);
  }
  moveDrag(e);
});
window.addEventListener('pointerup', e => { if (!drag || e.pointerId !== drag.pointerId) return; if (drag.started) endDrag(); drag = null; });
window.addEventListener('pointercancel', () => { if (drag && drag.started) cancelDrag(); drag = null; });
window.addEventListener('keydown', e => { if (e.key === 'Escape' && drag && drag.started) { e.preventDefault(); cancelDrag(); drag = null; } });
grid.addEventListener('click', e => { if (suppressClick) { e.preventDefault(); e.stopPropagation(); suppressClick = false; } }, true);

function startDrag(e) {
  const li = drag.li, rect = li.getBoundingClientRect();
  drag.started = true;
  drag.origIndex = indexOf(li);
  drag.prevOrder = domOrder();
  drag.offX = e.clientX - rect.left;
  drag.offY = e.clientY - rect.top;
  const ghost = li.cloneNode(true);
  ghost.classList.add('ghost');
  ghost.classList.remove('enter');
  ghost.style.width = rect.width + 'px';
  document.body.appendChild(ghost);
  drag.ghost = ghost;
  li.classList.add('placeholder');
  document.body.classList.add('dragging');
  announce(`已拿起${li.dataset.name}，目前位置第 ${drag.origIndex + 1} 本，共 ${grid.children.length} 本`);
}
function moveDrag(e) {
  const { ghost, li } = drag;
  ghost.style.transform = `translate(${e.clientX - drag.offX}px, ${e.clientY - drag.offY}px)`;
  const g = grid.getBoundingClientRect();
  const inside = e.clientX > g.left - 40 && e.clientX < g.right + 40 && e.clientY > g.top - 40 && e.clientY < g.bottom + 40;
  drag.invalid = !inside;
  ghost.classList.toggle('invalid', !inside);
  if (!inside) { placeAt(li, drag.origIndex); return; }
  let best = null, bestDist = Infinity;
  [...grid.children].forEach(c => {
    if (c === li) return;
    const r = c.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const d = Math.hypot(e.clientX - cx, (e.clientY - cy) * 1.6);
    if (d < bestDist) { bestDist = d; best = { c, cx }; }
  });
  if (!best) return;
  const others = [...grid.children].filter(c => c !== li);
  const target = others.indexOf(best.c) + (e.clientX > best.cx ? 1 : 0);
  placeAt(li, target);
}
function settleGhost(done) {
  const { ghost, li } = drag, r = li.getBoundingClientRect();
  const anim = ghost.animate([{ transform: ghost.style.transform }, { transform: `translate(${r.left}px, ${r.top}px)` }], { duration: 200, easing: 'cubic-bezier(.2,.8,.2,1)' });
  anim.onfinish = () => { ghost.remove(); li.classList.remove('placeholder'); done && done(); };
  document.body.classList.remove('dragging');
  suppressClick = true;
  setTimeout(() => suppressClick = false, 50);
}
function endDrag() {
  if (drag.invalid) return cancelDrag();
  const li = drag.li, prev = drag.prevOrder, moved = indexOf(li) !== drag.origIndex;
  settleGhost(() => { if (pendingRender) renderAlbums(); });
  if (moved) commitOrder(li, prev);
  else announce(`${li.dataset.name}維持在第 ${drag.origIndex + 1} 本`);
}
function cancelDrag() {
  const li = drag.li, name = li.dataset.name;
  placeAt(li, drag.origIndex);
  settleGhost(() => { if (pendingRender) renderAlbums(); });
  announce(`已取消移動，${name}回到原位`);
}
function commitOrder(li, prevOrder) {
  const next = domOrder(), pos = next.indexOf(li.dataset.id) + 1;
  announce(`${li.dataset.name}已移到第 ${pos} 本，共 ${next.length} 本`);
  if (SCENARIO === 'error') {
    setTimeout(() => {
      flip(() => prevOrder.forEach(id => grid.appendChild(cardEls.get(id))));
      toast('無法儲存相簿順序，已還原剛才的排列。請再試一次。');
      announce('無法儲存相簿順序，已還原剛才的排列');
    }, 600);
    return;
  }
  store.order = next;
  persist();
}

/* ---------- 鍵盤排序 ---------- */
let kb = null;
function columns() { const items = [...grid.children]; if (!items.length) return 1; const top = items[0].offsetTop; return Math.max(1, items.filter(el => el.offsetTop === top).length); }
grid.addEventListener('keydown', e => {
  const handle = e.target.closest('.handle');
  if (!handle) return;
  const li = handle.parentElement, total = grid.children.length;
  if (!kb) {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      kb = { li, origIndex: indexOf(li), prevOrder: domOrder() };
      li.classList.add('lifted');
      announce(`已拿起${li.dataset.name}，目前位置第 ${kb.origIndex + 1} 本，共 ${total} 本。使用方向鍵移動，空白鍵放下，Esc 取消`);
    }
    return;
  }
  const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -columns(), ArrowDown: columns() }[e.key];
  if (step) {
    e.preventDefault();
    const target = Math.min(total - 1, Math.max(0, indexOf(li) + step));
    placeAt(li, target);
    handle.focus();
    announce(`${li.dataset.name}，第 ${target + 1} 本，共 ${total} 本`);
  } else if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    const state = kb; kb = null;
    li.classList.remove('lifted');
    if (indexOf(li) !== state.origIndex) commitOrder(li, state.prevOrder);
    else announce(`${li.dataset.name}維持在第 ${state.origIndex + 1} 本`);
    if (pendingRender) renderAlbums();
  } else if (e.key === 'Escape' || e.key === 'Tab') {
    if (e.key === 'Escape') e.preventDefault();
    cancelKeyboard();
  }
});
grid.addEventListener('focusout', () => setTimeout(() => { if (kb && !kb.li.contains(document.activeElement)) cancelKeyboard(); }, 0));
function cancelKeyboard() {
  const state = kb; kb = null;
  state.li.classList.remove('lifted');
  placeAt(state.li, state.origIndex);
  state.li.querySelector('.handle').focus({ preventScroll: true });
  announce(`已取消移動，${state.li.dataset.name}回到原位`);
  if (pendingRender) renderAlbums();
}

/* ---------- 匯入 ---------- */
const dialog = document.getElementById('import-dialog');
const pill = document.getElementById('import-pill');
const pillText = document.getElementById('import-pill-text');
const bar = document.getElementById('progress-bar');
let importJob = null;

function showView(name) { dialog.querySelectorAll('[data-view]').forEach(v => v.hidden = v.dataset.view !== name); }
function openImport() {
  if (!importJob) showView('pick');
  else if (importJob.finished) { showView('done'); pill.hidden = true; }
  else showView('progress');
  dialog.showModal();
}
openImportBtn.addEventListener('click', openImport);
document.getElementById('empty-import').addEventListener('click', openImport);
pill.addEventListener('click', openImport);
dialog.addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target === dialog) dialog.close(); });
dialog.addEventListener('close', () => {
  if (importJob && importJob.finished) { importJob = null; pill.hidden = true; }
  else if (importJob) { pill.hidden = false; updatePill(); }
  renderAlbums();
});

function buildBatch() {
  const files = [];
  const add = (album, n) => { for (let i = 0; i < n; i++) files.push({ type: 'new', album, name: `IMG_${4400 + files.length}.${['HEIC', 'JPG', 'HEIC', 'PNG'][files.length % 4]}` }); };
  add('2026-10-25', 9); add('2026-10-24', 14); add('2026-10-18', 3);
  files.push({ type: 'dup', name: 'IMG_3982.HEIC' }, { type: 'dup', name: 'IMG_3982 (1).HEIC' });
  if (SCENARIO === 'error') files.push({ type: 'fail', name: 'IMG_4417.HEIC' }, { type: 'fail', name: 'IMG_4430.JPG' });
  const r = rng(77);
  for (let i = files.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [files[i], files[j]] = [files[j], files[i]]; }
  return { files, unsupported: ['行程表.pdf'], done: 0, added: 0, dup: 0, failed: [], finished: false };
}
document.getElementById('choose').addEventListener('click', () => {
  importJob = buildBatch();
  openImportBtn.hidden = false;
  bar.setAttribute('aria-valuemax', importJob.files.length);
  showView('progress');
  updateProgress();
  tick();
});
function updateProgress() {
  const j = importJob, total = j.files.length;
  document.getElementById('progress-label').textContent = `已完成 ${j.done}／${total}`;
  bar.setAttribute('aria-valuenow', j.done);
  bar.firstElementChild.style.width = (j.done / total * 100) + '%';
  updatePill();
}
function updatePill() {
  if (!importJob) return;
  pill.classList.toggle('done', importJob.finished);
  pillText.textContent = importJob.finished ? '查看匯入結果' : `匯入中 ${importJob.done}／${importJob.files.length}`;
}
function tick() {
  const j = importJob;
  if (j.done >= j.files.length) return finish();
  const f = j.files[j.done];
  setTimeout(() => {
    if (f.type === 'new') { store.added[f.album] = (store.added[f.album] || 0) + 1; j.added++; persist(); renderAlbums(); }
    else if (f.type === 'dup') j.dup++;
    else j.failed.push(f.name);
    j.done++;
    updateProgress();
    tick();
  }, 90 + Math.random() * 140);
}
function finish() {
  const j = importJob;
  j.finished = true;
  document.getElementById('done-title').textContent = `已新增 ${j.added} 張照片`;
  let html = '';
  if (j.dup) html += `<li>已略過 ${j.dup} 張重複照片</li>`;
  if (j.unsupported.length) html += `<li class="group">不支援的檔案</li>` + j.unsupported.map(n => `<li class="file">${n}</li>`).join('');
  if (j.failed.length) html += `<li class="group fail">無法匯入</li>` + j.failed.map(n => `<li class="file fail">${n}無法匯入。請確認檔案未損毀後再試一次。</li>`).join('');
  document.getElementById('done-list').innerHTML = html;
  showView('done');
  if (!dialog.open) { updatePill(); toast(`匯入完成：已新增 ${j.added} 張照片`); }
}

/* ---------- 啟動 ---------- */
try {
  const flash = sessionStorage.getItem('album-proto-flash');
  if (flash) { sessionStorage.removeItem('album-proto-flash'); setTimeout(() => toast(flash), 300); }
} catch (e) {}

if (SCENARIO === 'loading') {
  renderSkeleton(8);
} else {
  renderSkeleton(8);
  setTimeout(() => { grid.innerHTML = ''; grid.removeAttribute('aria-busy'); renderAlbums(); }, 450);
}
</script>
</body>
</html>
